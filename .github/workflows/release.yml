name: Manual npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from the selected v<version> tag
        required: true
        type: string
      publish:
        description: Publish the tested tarball using the configured npm trusted publisher
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      filename: ${{ steps.metadata.outputs.filename }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release source attribution
        run: |
          sh scripts/check-attribution.sh history HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
      - name: Verify selected release tag and package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@blackscaletech/swarm-sdk');
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`);
          assert.equal(process.env.GITHUB_REPOSITORY, 'blackscaletech/swarm-typescript-sdk');
          assert.equal(pkg.repository?.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          JS
      - run: node scripts/release-artifact.mjs check-npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
        env:
          npm_config_offline: 'true'
      - name: Record the tested tarball identity
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status"
          node scripts/release-artifact.mjs create .artifacts
      - name: Upload only the tested tarball and identity metadata
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swarm-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/${{ steps.metadata.outputs.filename }}
            .artifacts/release-metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          registry-url: https://registry.npmjs.org
      - run: node scripts/release-artifact.mjs check-npm
      - name: Download the immutable tested artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release-artifact
          merge-multiple: true
      - name: Verify the downloaded tarball without rebuilding or repacking
        id: validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/release-artifact.mjs verify release-artifact
      - name: Publish only the verified artifact via OIDC
        env:
          RELEASE_FILENAME: ${{ steps.validate.outputs.filename }}
        run: npm publish "./release-artifact/$RELEASE_FILENAME" --access public --provenance --ignore-scripts
